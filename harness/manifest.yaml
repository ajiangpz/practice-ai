project:
  name: practice-ai
  product_name: "练一下 · 手机摄影"
  current_phase: 2
  current_phase_name: backend-contract

phase_lock:
  enabled: true
  rule: "Do not implement a later phase unless the user explicitly advances the project."

stack:
  mini_program: "Taro 4"
  ui: "React + TypeScript + Sass"
  backend: "Python 3.11+ + FastAPI + Pydantic"
  backend_storage: "in-memory repository only"
  ai: "locked until phase 3"
  agent: "locked until phase 6"

active_scope:
  skill_id: BG-01
  skill_key: background_control
  preserve_routes:
    - pages/practice/index
    - pages/capture/index
    - pages/coach/index
  backend_endpoints:
    - "GET /health"
    - "POST /api/v1/practices"
    - "GET /api/v1/practices/{practice_id}"
    - "POST /api/v1/practices/{practice_id}/submissions"
    - "GET /api/v1/submissions/{submission_id}/result"
    - "POST /api/v1/practices/{practice_id}/complete"
  flow:
    - practice
    - capture_attempt_1
    - backend_mock_retry
    - capture_attempt_2
    - backend_mock_compare
    - complete

phase_1_regression_contract:
  - practice_page_behavior_unchanged
  - camera_and_album_still_supported
  - one_primary_issue_only
  - one_immediate_action_only
  - real_before_after_images_still_rendered
  - no_chat_ui

forbidden_in_phase_2:
  - real_ai
  - vision_model_sdk
  - external_model_api
  - database
  - orm
  - langgraph
  - rag
  - multi_agent
  - websocket
  - redis
  - bullmq
  - queue
  - vector_database
  - home_page
  - growth_page
  - extra_photography_skills
  - ai_chat_ui
  - cloud_object_storage

backend_requirements:
  framework: fastapi
  validation: pydantic
  repository: in_memory
  image_reference_policy: opaque_client_reference
  required_models:
    - PracticeCreateRequest
    - PracticeResponse
    - SubmissionCreateRequest
    - SubmissionResponse
    - CoachResultResponse
    - PracticeCompleteResponse
  deterministic_mock:
    attempt_1: retry
    attempt_2: compare

frontend_requirements:
  api_service_layer: required
  api_base_url_configurable: true
  local_attempt_result_branching: forbidden
  free_form_result_parsing: forbidden
  loading_state: required
  network_error_state: required

quality_gates:
  automated:
    - backend_imports
    - backend_tests_pass
    - required_endpoints_tested
    - frontend_typecheck_passes
    - weapp_build_passes
    - dist_exists
    - forbidden_phase_2_concepts_absent
  manual:
    - backend_running
    - mini_program_flow_completes_end_to_end
    - attempt_1_result_comes_from_api
    - attempt_2_result_comes_from_api
    - before_after_images_are_real_user_images
    - network_failure_has_recoverable_ui

completion_policy:
  command: "bash scripts/verify-phase2.sh"
  auto_advance: false
